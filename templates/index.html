<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Feedbacks</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        p.subtitulo {
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .grafico-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            width: 100%;
            max-width: 280px;
            margin-top: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #4338ca;
        }

        .resultado-card {
            border-left: 4px solid #ccc;
            padding: 16px;
            margin-bottom: 16px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .badge {
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            margin-left: 10px;
        }

        #lista-resultados h2 {
            margin-bottom: 16px;
            color: #1a1a2e;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Análise de Feedbacks</h1>
        <p class="subtitulo">Preencha o formulário abaixo para analisar o sentimento de um feedback.</p>

        <div class="dashboard-grid">
            <div class="card">
                <label for="cliente">Nome do cliente</label>
                <input type="text" id="cliente" placeholder="Ex: João Silva">

                <label for="feedback">Feedback</label>
                <textarea id="feedback" placeholder="Digite o feedback do cliente aqui..."></textarea>

                <button onclick="analisar()">Analisar Feedback</button>
            </div>

            <div class="grafico-card">
                <h3>Distribuição de Sentimentos</h3>
                <div class="canvas-container">
                    <canvas id="graficoSentimentos"></canvas>
                </div>
            </div>
        </div>

        <div id="lista-resultados"></div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
    const cores = {
        "Positivo": "#4CAF50",
        "Negativo": "#F44336",
        "Neutro": "#FF9800"
    };

    const dadosContagem = {
        "Positivo": 0,
        "Neutro": 0,
        "Negativo": 0
    };

    const ctx = document.getElementById('graficoSentimentos').getContext('2d');
    const meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Positivo', 'Neutro', 'Negativo'],
            datasets: [{
                data: [0, 0, 0],
                backgroundColor: [cores['Positivo'], cores['Neutro'], cores['Negativo']],
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });

    function atualizarGrafico(novoSentimento) {
        if (dadosContagem.hasOwnProperty(novoSentimento)) {
            dadosContagem[novoSentimento] += 1;
            
            meuGrafico.data.datasets[0].data = [
                dadosContagem['Positivo'],
                dadosContagem['Neutro'],
                dadosContagem['Negativo']
            ];
            meuGrafico.update();
        }
    }

    async function analisar() {
        const cliente = document.getElementById("cliente").value.trim();
        const feedback = document.getElementById("feedback").value.trim();

        if (!cliente || !feedback) {
            Toastify({
                text: "Aviso: Preencha todos os campos antes de enviar.",
                duration: 4000,
                close: true,
                gravity: "top",
                position: "right",
                style: { background: "#FF9800", color: "#ffffff" }
            }).showToast();
            return;
        }

        const botao = document.querySelector("button");
        botao.textContent = "Analisando...";
        botao.disabled = true;

        const toastCarregando = Toastify({
            text: "Processando a análise com o servidor de IA...",
            duration: -1, 
            gravity: "top",
            position: "right",
            style: { background: "#4f46e5" }
        }).showToast();

        try {
            const resposta = await fetch("/analisar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ cliente, feedback })
            });

            const dados = await resposta.json();
            toastCarregando.hideToast();

            if (!resposta.ok) {
                throw new Error(dados.erro || "Erro inesperado na resposta do servidor.");
            }

            exibirResultado(dados);
            atualizarGrafico(dados.sentimento);

            document.getElementById("cliente").value = "";
            document.getElementById("feedback").value = "";

            Toastify({
                text: "Análise concluída com sucesso.",
                duration: 3000,
                close: true,
                gravity: "top",
                position: "right",
                style: { background: "#4CAF50" }
            }).showToast();

        } catch (erro) {
            if (toastCarregando) toastCarregando.hideToast();

            Toastify({
                text: "Erro: " + erro.message,
                duration: 5000,
                close: true,
                gravity: "top",
                position: "right",
                style: { background: "#F44336" }
            }).showToast();
        } finally {
            botao.textContent = "Analisar Feedback";
            botao.disabled = false;
        }
    }

    function exibirResultado(item) {
        const cor = cores[item.sentimento] || "#9E9E9E";
        const lista = document.getElementById("lista-resultados");

        if (!lista.querySelector("h2")) {
            lista.innerHTML = "<h2>Resultados</h2>";
        }

        const card = document.createElement("div");
        card.className = "resultado-card";
        card.style.borderLeftColor = cor;
        card.innerHTML = `
            <strong>${item.cliente}</strong>
            <span class="badge" style="background: ${cor}">${item.sentimento}</span>
            <p style="margin-top: 8px; color: #444">${item.feedback}</p>
            <p style="margin-top: 6px; color: #666; font-size: 14px">Palavra-chave: ${item.palavra_chave}</p>
            <p style="color: #666; font-size: 14px">Resumo: ${item.resumo}</p>
        `;

        lista.appendChild(card);
    }
</script>
</body>

</html>
